<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1D4ED8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Internal Ring Highlight -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Dynamic Geometric Layers (Productivity Folders / Cards) -->
  <path d="M160 176 L352 176" stroke="rgba(255, 255, 255, 0.35)" stroke-width="24" stroke-linecap="round" />
  
  <!-- Main Accent Checkmark & Surge Icon -->
  <path d="M164 276 L228 340 L356 204" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Modern Accent Dot -->
  <circle cx="360" cy="156" r="18" fill="url(#sparkGrad)" />
</svg>
