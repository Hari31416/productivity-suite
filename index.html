<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Primary Meta Tags & SEO -->
    <title>Productivity Suite - Offline-First Tasks, Habits &amp; Notes</title>
    <meta name="title" content="Productivity Suite - Offline-First Tasks, Habits &amp; Notes" />
    <meta name="description"
      content="Local, offline-first productivity suite featuring smart task management, habit streak tracking, markdown notes, and local backups." />
    <meta name="keywords"
      content="productivity, task manager, habit tracker, markdown notes, offline-first, local-first, privacy-focused, indexeddb" />
    <meta name="author" content="Productivity Suite" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0A7A64" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1211" media="(prefers-color-scheme: dark)" />
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Productivity Suite - Offline-First Tasks, Habits &amp; Notes" />
    <meta property="og:description"
      content="Manage your tasks, track habits with streaks, and write markdown notes with 100% offline privacy." />
    <meta property="og:image" content="/icon.png" />
    <meta property="og:site_name" content="Productivity Suite" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Productivity Suite - Offline-First Tasks, Habits &amp; Notes" />
    <meta name="twitter:description"
      content="Manage your tasks, track habits with streaks, and write markdown notes with 100% offline privacy." />
    <meta name="twitter:image" content="/icon.png" />
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:#0b1211;color:#f0fdf9;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;gap:1.25rem;">
        <img src="/icon.png" alt="Productivity Suite" style="width:68px;height:68px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,0.35);" />
        <div style="font-size:1.125rem;font-weight:600;letter-spacing:-0.02em;">Productivity Suite</div>
        <div style="width:28px;height:28px;border:3px solid rgba(10,122,100,0.25);border-top-color:#0a7a64;border-radius:50%;animation:app-spin 0.75s linear infinite;"></div>
      </div>
      <style>
        @keyframes app-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
